<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd84d">
  <title>Pancho HTTP · Todo en orden</title>
  <link rel="stylesheet" href="/health.css">
</head>
<body>
  <main class="card">
    <div class="topline">
      <span class="brand">PANCHO<span>HTTP</span></span>
    </div>

    <div class="scene" role="img" aria-label="Un pancho sonriente con mostaza saluda desde su pan">
      <span class="spark spark-one" aria-hidden="true">✦</span>
      <span class="spark spark-two" aria-hidden="true">✳</span>
      <span class="spark spark-three" aria-hidden="true">✦</span>
      <div class="hotdog">
        <div class="bun bun-back"></div>
        <div class="sausage">
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="smile"></span>
        </div>
        <div class="mustard"></div>
        <div class="bun bun-front"></div>
      </div>
      <span class="shadow" aria-hidden="true"></span>
    </div>

    <div class="copy">
      <h1>¡Está todo<br><em>200 OK!</em></h1>
      <p class="tagline">A este pancho, <strong>sí me lo como.</strong></p>
      <a class="button" href="/">Volver a armar mi pancho <span aria-hidden="true">↗</span></a>
    </div>

  </main>
</body>
</html>
